server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Allow motion/orientation sensors on iOS/Safari
  add_header Permissions-Policy "accelerometer=(self), gyroscope=(self), magnetometer=(), geolocation=(self)" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer-when-downgrade always;

  # Critical: ES modules must be served as application/javascript or text/javascript
  location ~* \.js$ {
    types { }
    default_type application/javascript;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|css|json|webmanifest)$ {
    expires 30d;
    access_log off;
  }
}

