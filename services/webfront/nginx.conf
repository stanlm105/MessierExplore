# Redirect www -> apex (only if DNS/Cloud Run maps 'www' to this service)
server {
  listen 8080;
  server_name www.messierexplore.com;
  return 301 https://messierexplore.com$request_uri;
}

# Your existing config unchanged
server {
  listen 8080 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js)$ {
    expires 30d;
    access_log off;
  }
}
